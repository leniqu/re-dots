# ФОН (Обои с блюром)
background {
    monitor =
    # path = /home/user/Pictures/wallpapers/current.png  # Можно указать путь к обоям
    path = screenshot                                    # Или брать текущий кадр экрана
    color = rgba(25)                                     # Цвет-подложка

    # Настройки размытия (как у Ильи)
    blur_passes = 3            # Количество проходов (больше = сильнее блюр)
    blur_size = 7              # Размер размытия
    noise = 0.0117             # Немного шума для эстетики
    contrast = 0.8916          # Контрастность
    brightness = 0.8172        # Яркость (чуть приглушить фон)
    vignette = 0.1             # Затемнение по краям
    vignette_thickness = 0.3
}

# Часы (оптимизировано: $TIME быстрее, чем cmd)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 80             # Сделал чуть крупнее для акцента
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 24
    font_family = JetBrains Mono
    position = 0, 70
    halign = center
    valign = center
}

# Поле ввода пароля
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0) # Прозрачная рамка
    inner_color = rgba(255, 255, 255, 0.1) # Полупрозрачный "стеклянный" фон
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
